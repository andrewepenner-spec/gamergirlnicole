<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Manor Files — Public Theater</title><link rel="stylesheet" href="/styles.css"><style>
.theater{min-height:100vh;background:#090d12;padding:30px;display:grid;grid-template-columns:minmax(0,3fr) minmax(310px,1fr);gap:22px;max-width:1900px;margin:auto}.theater .film-view{height:65vh;min-height:450px}.theater .film-line{font-size:clamp(34px,4vw,72px)}.theater .paper{max-height:calc(100vh - 60px);overflow:auto}.theater h1{font-size:clamp(43px,4vw,75px)}.theater .lead-row{font-size:13px}.theater-side{display:flex;flex-direction:column;gap:16px}.theater-badge{background:#813648;color:#ffebd0;font:700 11px 'DM Mono',monospace;letter-spacing:2px;padding:8px 13px;display:inline-block;border-radius:3px;margin-bottom:17px}.theater .scene-display{width:100%;padding:20px 0}.code-label{font:16px 'DM Mono',monospace;color:#c9a16c}.fullscreen-button{float:right;border:1px solid #d6ab73;background:transparent;color:#e9d2ac;padding:7px 11px;border-radius:4px;cursor:pointer}@media(max-width:980px){.theater{grid-template-columns:1fr;padding:15px}.theater .paper{max-height:none}.theater .film-view{height:52vw;min-height:320px}}
